name: Auto Build Beszel Binary

on:
  push:
    branches:
      - 'my-beszel-features-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（升级至 v5）
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. 配置 Node.js（升级至 v5，支持最新 Node 22/24 运行时）
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 3. 配置 Go（升级至 v6）
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      # 4. 编译前端 Hub UI
      - name: Build Hub UI (Frontend)
        run: |
          cd beszel/site
          npm install
          npm run build

      # 5. 交叉编译 Linux 纯静态二进制文件
      - name: Build Linux Binaries (Backend)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o beszel-hub ./beszel/cmd/hub
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o beszel-agent ./beszel/cmd/agent

      # 6. 打包上传产物（升级至 v5）
      - name: Upload Binaries Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: beszel-linux-amd64
          path: |
            beszel-hub
            beszel-agent